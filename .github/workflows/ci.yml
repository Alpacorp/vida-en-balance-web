name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch makes the previous run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Without this the GITHUB_TOKEN is issued with the repository's default scopes,
# which include write access this job has no use for: it reads the code, checks
# it and throws the result away.
permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the node image the Dockerfile builds with.
          node-version: 22
          cache: npm

      # `npm install`, not `npm ci`, because the Dockerfile that builds
      # production installs the same way.
      #
      # npm ci additionally demands that the lockfile already match the tree it
      # would resolve on this machine. The wasm fallbacks of @tailwindcss/oxide
      # and @rolldown/binding pull @emnapi/* through optional, platform-gated
      # dependencies, and npm on Windows — where this project is developed —
      # drops parts of those subtrees from the lockfile it writes. Linux then
      # reports the missing entry and refuses to install. Regenerating the file
      # on Windows makes it worse, not better.
      #
      # So npm ci here would fail on a lockfile that installs correctly
      # everywhere it is actually used, guarding a strictness production never
      # relies on. The checks that follow are the ones with something to say.
      - run: npm install

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Also covers the prerender step: it fails the build if a route renders
      # with a Suspense boundary React had to defer, which would ship a page
      # whose content only appears once JavaScript runs.
      - name: Build
        run: npm run build
        env:
          VITE_BASE_URL: https://webapp-vida-en-balance-prd.azurewebsites.net
