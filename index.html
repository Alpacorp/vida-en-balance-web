<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8"/>
    <!-- The file is a JPEG. Declaring it as image/svg+xml made browsers that
         trust the hint discard it and fall back to /favicon.ico, which the
         site does not ship. -->
    <link rel="icon" type="image/jpeg" href="/favicon.jpg"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <!-- Placeholders for `npm run dev`, where nothing is prerendered. The build
         strips both and injects the real per-page values instead: browsers and
         crawlers keep the FIRST title and description they find, so leaving
         these in place would override every page with the generic copy. -->
    <title>San Rafael Balance®</title>
    <meta name="description"
          content="Recetas, consejos de bienestar y productos San Rafael Balance® para disfrutar cuidándote."/>

    <!-- The two families covering nearly all visible text. Without preload the
         browser only discovers them after fetching and applying the CSS, which
         lengthens the flash of fallback text.
         crossorigin is required: fonts are always requested in CORS mode, and
         without it the preload would be discarded and the file fetched twice. -->
    <link rel="preload" as="font" type="font/woff2"
          href="/assets/fonts/Montserrat-Medium.woff2" crossorigin/>
    <link rel="preload" as="font" type="font/woff2"
          href="/assets/fonts/Montserrat-Bold.woff2" crossorigin/>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
